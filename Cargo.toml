[package]
name = "nexuslang"
version = "0.1.0"
edition = "2021"

[lib]
name = "nexuslang"
path = "src/lib.rs"

[[bin]]
name = "nxc"
path = "src/main.rs"

[[bin]]
name = "nxvm"
path = "src/bin/nxvm.rs"

[dependencies]
inkwell = {version = "0.8.0", features = ["llvm21-1"]}
clap = { version = "4.5", features = ["derive"] }
roxmltree = "0.21.1"
kdl = "6.0"
reqwest = {version = "0.13.2", features = ["blocking"]}
anyhow = "1.0"